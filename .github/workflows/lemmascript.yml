name: LemmaScript

on:
  push:
    branches: [main, guard]
  pull_request:
    branches: [main, guard]

jobs:
  verify:
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@main
    with:
      backend: dafny
      node-version: '24'

  guard-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci

      - name: Clone latest verification toolchains
        run: |
          git clone --depth 1 https://github.com/midspiral/LemmaScript.git ../LemmaScript
          git clone --depth 1 https://github.com/midspiral/lemmascript-guard.git ../lemmascript-guard

      - name: Install and build verification toolchains
        run: |
          cd ../LemmaScript
          npm ci
          npm run build
          cd ../lemmascript-guard
          npm ci
          npm run build

      - name: Regenerate runtime guard
        env:
          LEMMASCRIPT: ../LemmaScript
        run: npm run guard

      - name: Require a complete, current guard
        run: |
          git diff --exit-code -- '*.guarded.ts'
          if grep -R "UNENFORCED" src/*.guarded.ts; then
            echo "ERROR: incomplete runtime guard"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run demo

      - name: Install UI dependencies
        run: cd ui && npm ci
      - name: Typecheck UI
        run: cd ui && npx tsc --noEmit
      - name: Build UI
        run: cd ui && npm run build
