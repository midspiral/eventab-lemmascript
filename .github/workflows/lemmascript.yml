name: LemmaScript

on:
  push:
    branches: [main, guard]
  pull_request:
    branches: [main, guard]

jobs:
  verify:
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@main
    with:
      backend: dafny
      node-version: '24'

  guard-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci

      - name: Clone latest LemmaScript
        run: git clone https://github.com/midspiral/LemmaScript.git ../LemmaScript

      - name: Build lsc with the published guard
        working-directory: ../LemmaScript
        run: |
          npm ci --include=optional
          npm run build

      - name: Regenerate runtime guard
        run: |
          rm src/allocate.guarded.ts
          npm run guard

      - name: Require a complete, current guard
        run: |
          git diff --exit-code -- '*.guarded.ts'
          untracked=$(git ls-files --others --exclude-standard -- '*.guarded.ts')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked generated guards:"
            echo "$untracked"
            exit 1
          fi
          if grep -n "UNENFORCED" src/*.guarded.ts; then
            echo "ERROR: incomplete runtime guard"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run demo

      - name: Install UI dependencies
        run: cd ui && npm ci
      - name: Typecheck and build UI
        run: cd ui && npm run build
